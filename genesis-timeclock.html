<title>Genesis Shop Time Clock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one white page, one column, hairline dividers instead of boxes. Blue is the only accent; green, amber and red appear only as small status marks. */
:root{
  color-scheme:light;
  --bg:#ffffff; --ink:#111827; --muted:#5b6472; --line:#e4e7ec; --soft:#f5f7fa;
  --accent:#1d4ed8; --on-accent:#ffffff;
  --rev:#15803d; --et:#b45309; --idle:#c2410c; --bad:#b91c1c;
  --font:"Inter","Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--font);font-variant-numeric:tabular-nums}
.wrap{max-width:960px;margin:0 auto;padding-block:28px 72px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:32px}
h1,h2,h3,p{margin:0}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
h2{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
h3{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
section{display:flex;flex-direction:column;gap:16px;min-width:0}

.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line)}
.brand span{display:block;font-size:14px;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 18px;font-weight:600;font-size:16px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.large{padding:16px 28px;font-size:19px}
.btn.danger{color:var(--bad)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:15px}
input[type=text],input[type=password],select{border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--bg);font-size:17px;min-width:0}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted);min-width:0}

.st{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:500;color:var(--muted);white-space:nowrap}
.st i,.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.st.ro i,.dot.ro{background:var(--rev)} .st.e i,.dot.e{background:var(--et)} .st.idle i,.dot.idle{background:var(--idle)}
.st.ro,.st.e,.st.idle{color:var(--ink)}

.banner{background:var(--soft);border-radius:10px;padding:12px 16px;font-size:15px}

/* sign in */
.signin{max-width:440px;margin:24px auto 0;width:100%}
.people{display:flex;flex-direction:column}
.people button{display:flex;justify-content:space-between;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 4px;text-align:left;font-size:18px;font-weight:600}
.people button:hover{color:var(--accent)}
.people span{font-size:15px;font-weight:400;color:var(--muted)}

/* technician screen */
.now{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;padding:24px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.now .what{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.timer{font-size:52px;font-weight:600;letter-spacing:-.02em;line-height:1}
.startro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;gap:12px;align-items:end}
@media (max-width:640px){.startro{grid-template-columns:minmax(0,1fr)}}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ebtn{display:flex;gap:10px;align-items:baseline;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px}
.ebtn:hover{border-color:var(--ink)}
.ebtn.on{border-color:var(--et);background:var(--soft)}
.ebtn b{font-weight:700;color:var(--et);min-width:34px}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
@media (max-width:520px){.log li{grid-template-columns:minmax(0,1fr) auto}.log li span:first-child{grid-column:1/-1;color:var(--muted)}}

/* owner */
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 0;font-weight:600;font-size:16px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:8px 14px;font-size:15px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lead{font-size:22px;line-height:1.4;max-width:34em;text-wrap:balance}
.lead b{font-weight:700}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:13px;font-weight:600;color:var(--muted);vertical-align:bottom}
th small{display:block;font-weight:400;white-space:normal;min-width:64px;line-height:1.25}
th:first-child,td:first-child{text-align:left;padding-left:0}
td.l,th.l{text-align:left}
td.wrapc{white-space:normal;min-width:160px}
tfoot td{font-weight:700;border-bottom:0;border-top:1px solid var(--ink)}
.good{color:var(--rev);font-weight:600} .mid{color:var(--et);font-weight:600} .bad{color:var(--bad);font-weight:600}
.rank td{font-size:17px}
.rank .n{color:var(--muted);width:28px}
.rank .name{font-weight:600}
.rank tr.first .name{font-weight:700}
.tag{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:600;letter-spacing:.02em;vertical-align:middle}
.barcell{min-width:150px;width:32%}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:4px}
.rank tr.first .bar i{background:var(--accent)}
.live{display:grid;grid-template-columns:120px 150px minmax(0,1fr) 84px;gap:8px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.live b{font-size:17px}
.track{position:relative;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.track i{position:absolute;top:0;bottom:0}
.track .shift{background:var(--idle)} .track .ro{background:var(--rev)} .track .e{background:var(--et)}
@media (max-width:640px){.live{grid-template-columns:minmax(0,1fr) auto}.live .track{grid-column:1/-1}}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px}
.fig b{display:block;font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.fig span{font-size:15px;color:var(--muted)}
.erow{display:grid;grid-template-columns:230px minmax(0,1fr) 70px;gap:16px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.erow b{display:inline-block;min-width:36px;color:var(--et)}
.erow span:last-child{text-align:right}
.erow .bar i{background:var(--et)}
@media (max-width:560px){.erow{grid-template-columns:minmax(0,1fr) 70px}.erow .bar{grid-column:1/-1;grid-row:2}}
td input{width:76px;padding:6px 8px;text-align:right;font-size:15px}
textarea{width:100%;height:140px;font:13px monospace;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
.foot{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:10px;font-size:15px;font-weight:500;max-width:calc(100% - 32px);z-index:5}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Shop Time Clock</h1><span>Genesis Automotive &amp; RV</span></div>
    <div class="row" id="who"></div>
  </header>
  <main id="view" class="stack" style="gap:32px"></main>
  <footer class="foot">Mockup with example punches. Changes save only in this browser. <button class="link" data-act="reset" style="font-size:14px">Reset the example day</button></footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
var H=3600000, FORECAST=8, KEY='genesis-timeclock-v3', PIN='1234';
var ECODES=[['E1','Moving vehicles'],['E2A','Quality control (paid)'],['E2B','Comeback repair'],['E3','Idle time'],['E4','Helping others'],['E5','Bldg. maint. / clean up'],['E6','Equipment maint.'],['E7','Supervisory time'],['E8','Leasehold improvements'],['E9','Break time'],['E10','On-site training'],['E11','On-job training']];
var ENAME={}; ECODES.forEach(function(e){ENAME[e[0]]=e[1]});
/* month-to-date hours taken from the June CompuTrek sheet */
var MONTH={'31':{sold:29.27,avail:29.27,ro:29.27},'87':{sold:179.21,avail:157.17,ro:144.36},'33':{sold:192.88,avail:153.41,ro:141.31},'52':{sold:256.46,avail:157.20,ro:153.48},'15':{sold:51.61,avail:105.80,ro:64.86}};
var S, toastTimer, ui={user:'owner',pick:null,err:'',viewAs:null,tab:'overview',period:'month',sort:'sold',confirm:false,finishing:false,copy:null};

function seed(){
  var now=Date.now(), t0=now-6.2*H, k=1, d=new Date(), open=new Date(d.getFullYear(),d.getMonth(),d.getDate(),7,30).getTime();
  /* during shop hours, stretch the example day so it starts at 7:30 AM */
  if(now-open>2.5*H&&now-open<10.5*H){t0=open;k=(now-open)/(6.2*H)}
  var at=function(h){return Math.round(t0+h*k*H)};
  var s={seedAt:now,dayStart:t0,
    techs:[{id:'31',name:'Craig'},{id:'102',name:'Tech 102'},{id:'87',name:'Winstel'},{id:'104',name:'Tech 104'},{id:'33',name:'Ken'},{id:'107',name:'Tech 107'},{id:'52',name:'Eric'},{id:'15',name:'Jeremy'}],
    jobs:[
     {id:'48207',desc:'Roof A/C replacement',sold:3.5},{id:'48211',desc:'Slide-out motor',sold:null},
     {id:'48198',desc:'Water heater, no ignition',sold:2.5},{id:'48203',desc:'Reseal roof seams',sold:4.0},
     {id:'48214',desc:'Awning fabric',sold:null},{id:'48209',desc:'Wheel bearing repack',sold:2.8},
     {id:'48212',desc:'LP leak test',sold:null},{id:'48201',desc:'Generator service',sold:3.0},
     {id:'48210',desc:'Brake controller install',sold:null},{id:'48206',desc:'',sold:null}],
    punches:[],entries:[]};
  function P(t,a,b,meal){s.punches.push({tech:t,in:at(a),out:b==null?null:at(b),meal:!!meal})}
  function N(t,k,r,a,b){s.entries.push({tech:t,kind:k,ref:r,start:at(a),end:b==null?null:at(b)})}
  function D(id,t,h){var j=s.jobs.filter(function(j){return j.id==id})[0];j.status='done';j.doneBy=t;j.doneAt=at(h)}
  P('31',0); N('31','ro','48207',0,2.6); D('48207','31',2.6); N('31','e','E9',2.6,2.85); N('31','ro','48211',2.85);
  P('87',0.05); N('87','ro','48198',0.05,1.9); D('48198','87',1.9); N('87','e','E4',1.9,2.4); N('87','ro','48203',2.4,5.3); D('48203','87',5.3); N('87','ro','48214',5.3);
  P('33',0,3.0,true); P('33',3.5); N('33','e','E1',0,0.4); N('33','ro','48209',0.4,3.0); D('48209','33',3.0); N('33','ro','48212',3.5);
  P('52',0.1); N('52','ro','48201',0.1,2.2); D('48201','52',2.2); N('52','e','E9',2.2,2.45); N('52','e','E2B',2.45,3.6); N('52','ro','48210',3.6,5.6);
  P('15',0); N('15','e','E7',0,1.5); N('15','e','E5',1.5,2.3); N('15','ro','48206',2.3,4.4); D('48206','15',4.4); N('15','e','E11',4.4);
  return s;
}
function load(){ try{var s=JSON.parse(localStorage.getItem(KEY)); if(s&&new Date(s.seedAt).toDateString()==new Date().toDateString()) return s}catch(e){} return seed() }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} }

function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function tech(id){return S.techs.filter(function(t){return t.id==id})[0]}
function job(id){return S.jobs.filter(function(j){return j.id==id})[0]}
function cur(id){return S.entries.filter(function(e){return e.tech==id&&!e.end})[0]}
function openPunch(id){return S.punches.filter(function(p){return p.tech==id&&!p.out})[0]}
function hrs(ms){return (ms/H).toFixed(2)}
function blank(ms){return ms>30000?hrs(ms):''}
function hms(ms){var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;return h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s}
function tm(t){return new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function pct(n,d){return d>0?Math.round(n/d*100):null}
function label(e){return e.kind=='ro'?'RO '+e.ref:e.ref+' '+ENAME[e.ref]}
function me(){return ui.viewAs||ui.user}

function status(id){
  var c=cur(id); if(c) return c.kind;
  if(openPunch(id)) return 'idle';
  var ps=S.punches.filter(function(p){return p.tech==id}); if(!ps.length) return 'off';
  return ps[ps.length-1].meal?'meal':'out';
}
var SLABEL={ro:'On a repair order',e:'E-time',idle:'Idle, no job',meal:'Meal break',out:'Clocked out',off:'Not clocked in'};
function st(s){return '<span class="st '+s+'"><i></i>'+SLABEL[s]+'</span>'}
function stats(id){
  var now=Date.now(),avail=0,ro=0,sum=0,e={};
  S.punches.forEach(function(p){if(p.tech==id)avail+=(p.out||now)-p.in});
  S.entries.forEach(function(x){if(x.tech!=id)return;var d=(x.end||now)-x.start;sum+=d;if(x.kind=='ro')ro+=d;else e[x.ref]=(e[x.ref]||0)+d});
  var idle=Math.max(0,avail-sum); e.E3=(e.E3||0)+idle;
  var sold=0; S.jobs.forEach(function(j){if(j.doneBy==id)sold+=j.sold||0});
  return {avail:avail,ro:ro,e:e,etot:avail-ro,sold:sold};
}
function jobClocked(id){var now=Date.now(),t=0;S.entries.forEach(function(x){if(x.kind=='ro'&&x.ref==id)t+=(x.end||now)-x.start});return t}
function activity(id){
  var c=cur(id),s=status(id);
  if(c&&c.kind=='ro'){var j=job(c.ref);return {t:'RO '+j.id,s:j.desc,since:c.start}}
  if(c)return {t:c.ref+' '+ENAME[c.ref],s:'Non-revenue time',since:c.start};
  if(s=='idle'){var last=0;S.entries.forEach(function(x){if(x.tech==id&&x.end>last)last=x.end});return {t:'No job selected',s:'This time counts as E3 idle',since:Math.max(last,openPunch(id).in)}}
  return null;
}
/* performance for the leaderboard, in hours */
function perf(id,period){
  var x=stats(id),p={sold:x.sold,avail:x.avail/H,ro:x.ro/H},m=MONTH[id];
  if(period=='month'&&m){p.sold+=m.sold;p.avail+=m.avail;p.ro+=m.ro}
  p.et=p.avail-p.ro; p.eff=p.ro>0.02?pct(p.sold,p.ro):null; p.prod=pct(p.ro,p.avail);
  return p;
}

/* actions */
function endCur(id){var c=cur(id); if(c)c.end=Date.now()}
function say(m){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},3500)}
function startEntry(id,k,ref){var c=cur(id); if(c&&c.kind==k&&c.ref==ref)return; endCur(id);S.entries.push({tech:id,kind:k,ref:ref,start:Date.now(),end:null});say(tech(id).name+' is now on '+(k=='ro'?'RO '+ref:ref+' '+ENAME[ref]))}
function complete(id,sold){var c=cur(id),j=job(c.ref);endCur(id);j.status='done';j.doneBy=id;j.doneAt=Date.now();if(sold!=null)j.sold=sold;
  say('RO '+j.id+' finished.'+(sold!=null?' '+sold.toFixed(1)+' sold hours credited to '+tech(id).name+'.':' The office will add the sold hours.'))}
var ACT={
  pick:function(d){ui.pick=d.id;ui.err=''},
  unpick:function(){ui.pick=null;ui.err=''},
  signout:function(){ui.user=ui.viewAs=ui.pick=null},
  exitview:function(){ui.viewAs=null},
  tab:function(d){ui.tab=d.v},
  period:function(d){ui.period=d.v},
  sort:function(d){ui.sort=d.v},
  in:function(){S.punches.push({tech:me(),in:Date.now(),out:null});say(tech(me()).name+' clocked in at '+tm(Date.now()))},
  out:function(){ if(!ui.confirm){ui.confirm=true;return 'keep'} endCur(me());openPunch(me()).out=Date.now();say(tech(me()).name+' clocked out at '+tm(Date.now()))},
  meal:function(){endCur(me());var p=openPunch(me());p.out=Date.now();p.meal=true;say(tech(me()).name+' is on an unpaid meal break')},
  start:function(d){startEntry(me(),d.k,d.ref)},
  stop:function(){endCur(me());say('Paused. Pick the next RO or an E-time code.')},
  done:function(){ui.finishing=true;return 'keep'},
  finishskip:function(){complete(me(),null)},
  reset:function(){S=seed();say('Example day reset')},
  copy:function(){var t=reportTSV(); ui.copy=null;
    try{navigator.clipboard.writeText(t).then(function(){say('Report copied. Paste it into Excel or Google Sheets.')},function(){ui.copy=t;render()})}catch(e){ui.copy=t}}
};
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]'); if(!b)return;
  var r=ACT[b.dataset.act](b.dataset); if(r!='keep'){ui.confirm=false;ui.finishing=false}
  save();render();
});
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.id=='viewas'){ui.viewAs=el.value||null;ui.confirm=ui.finishing=false;render()}
  if(el.dataset.sold){var v=parseFloat(el.value);job(el.dataset.sold).sold=isNaN(v)?null:v;save();render();say('Sold hours saved for RO '+el.dataset.sold)}
});
document.addEventListener('submit',function(ev){
  ev.preventDefault(); var f=ev.target, v=function(n){return f.elements[n].value.trim()};
  if(f.dataset.form=='login'){
    if(v('pin')!=PIN){ui.err='That PIN does not match. For this demo every PIN is '+PIN+'.'}
    else{ui.user=ui.pick;ui.pick=null;ui.err='';ui.viewAs=null}
  }
  if(f.dataset.form=='start'){
    var ro=v('ro').replace(/^ro\s*/i,''); if(!ro)return say('Type the RO number from the printed repair order.');
    var j=job(ro); if(j&&j.status=='done')return say('RO '+ro+' is already finished. Ask the office to reopen it.');
    if(!j)S.jobs.push({id:ro,desc:v('note'),sold:null}); else if(v('note')&&!j.desc)j.desc=v('note');
    startEntry(me(),'ro',ro);
  }
  if(f.dataset.form=='finish'){var n=parseFloat(v('sold')); complete(me(),isNaN(n)?null:n); ui.finishing=false}
  save();render();
});

/* sign in */
function vLogin(){
  if(ui.pick){var n=ui.pick=='owner'?'Brian':tech(ui.pick).name;
    return '<form class="signin stack" data-form="login" style="gap:20px"><h2>Hi '+esc(n)+'</h2>'+
      '<label class="f">Your 4-digit PIN<input id="pin" name="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label>'+
      (ui.err?'<p class="bad small">'+esc(ui.err)+'</p>':'<p class="muted small">Demo PIN for everyone: '+PIN+'</p>')+
      '<div class="row"><button class="btn primary" type="submit">Sign in</button><button class="link" type="button" data-act="unpick">Not '+esc(n)+'?</button></div></form>'}
  return '<div class="signin stack" style="gap:20px"><h2>Who is signing in?</h2><div class="people">'+
    '<button data-act="pick" data-id="owner">Brian Holthe<span>Owner</span></button>'+
    S.techs.map(function(t){return '<button data-act="pick" data-id="'+t.id+'">'+esc(t.name)+'<span>Technician '+t.id+'</span></button>'}).join('')+'</div></div>';
}

/* technician screen */
function vTech(id){
  var t=tech(id),s=status(id),a=activity(id),c=cur(id),x=stats(id),h='';
  if(ui.viewAs)h+='<div class="banner row spread"><span>You are viewing the app as <b>'+esc(t.name)+'</b>. Anything you tap here is recorded on '+esc(t.name)+'’s time card.</span><button class="link" data-act="exitview">Back to owner view</button></div>';
  h+='<section><div class="row spread"><h2>'+esc(t.name)+'</h2>'+st(s)+'</div>';
  if(!a){
    h+='<div class="now"><p class="muted" style="max-width:26em">'+(s=='meal'?'You are on an unpaid meal break.':'Clock in when you arrive. Then enter the repair order you are working on.')+'</p>'+
       '<button class="btn primary large" data-act="in">'+(s=='meal'?'Back from meal':'Clock in')+'</button></div></section>';
  } else {
    h+='<div class="now"><div><div class="what">'+esc(a.t)+'</div><div class="muted">'+esc(a.s||'')+'</div></div><div class="timer" data-since="'+a.since+'"></div>'+
       (ui.finishing&&c&&c.kind=='ro'?
         '<form class="row" data-form="finish" style="align-items:flex-end;flex-basis:100%"><label class="f">Sold hours printed on the RO<input id="sold" name="sold" type="text" inputmode="decimal" placeholder="e.g. 2.5" style="width:170px"></label><button class="btn primary" type="submit">Finish job</button><button class="link" type="button" data-act="finishskip">Skip, the office will add it</button></form>':
         '<div class="row">'+(c&&c.kind=='ro'?'<button class="btn primary" data-act="done">Job complete</button>':'')+(c?'<button class="btn" data-act="stop">'+(c.kind=='ro'?'Pause':'Stop')+'</button>':'')+'</div>')+
       '</div></section>';
    var mine=S.jobs.filter(function(j){return j.status!='done'&&!(c&&c.kind=='ro'&&c.ref==j.id)&&S.entries.some(function(e){return e.tech==id&&e.kind=='ro'&&e.ref==j.id})});
    h+='<section><h3>Start a repair order</h3><form class="startro" data-form="start">'+
       '<label class="f">RO number<input id="ro" name="ro" type="text" inputmode="numeric" placeholder="From the printed RO" autocomplete="off"></label>'+
       '<label class="f">What you are doing (optional)<input id="note" name="note" type="text" placeholder="e.g. Replace water pump" autocomplete="off"></label>'+
       '<button class="btn primary" type="submit">Start</button></form>'+
       (mine.length?'<div class="row"><span class="muted small">Pick up where you left off:</span>'+mine.map(function(j){return '<button class="btn" data-act="start" data-k="ro" data-ref="'+esc(j.id)+'">RO '+esc(j.id)+'</button>'}).join('')+'</div>':'')+'</section>';
    h+='<section><h3>Not on a repair order? Pick an E-time code</h3><div class="egrid">'+ECODES.filter(function(e){return e[0]!='E3'}).map(function(e){var on=c&&c.kind=='e'&&c.ref==e[0];
        return '<button class="ebtn'+(on?' on':'')+'" data-act="start" data-k="e" data-ref="'+e[0]+'"><b>'+e[0]+'</b><span>'+e[1]+'</span></button>'}).join('')+'</div>'+
       '<div class="row"><button class="btn" data-act="meal">Meal break (unpaid)</button><button class="btn danger" data-act="out">'+(ui.confirm?'Tap again to clock out':'Clock out for the day')+'</button></div></section>';
  }
  var log=[]; S.punches.forEach(function(p){if(p.tech!=id)return;log.push({at:p.in,h:'<span>'+tm(p.in)+'</span><span>Clocked in</span><span></span>'});if(p.out)log.push({at:p.out,h:'<span>'+tm(p.out)+'</span><span>'+(p.meal?'Meal break (unpaid)':'Clocked out')+'</span><span></span>'})});
  S.entries.forEach(function(e){if(e.tech!=id)return;var j=e.kind=='ro'?job(e.ref):null;
    log.push({at:e.start+1,h:'<span>'+tm(e.start)+' to '+(e.end?tm(e.end):'now')+'</span><span><i class="dot '+e.kind+'" style="margin-right:8px"></i>'+esc(label(e))+(j&&j.desc?', '+esc(j.desc):'')+'</span><span>'+hrs((e.end||Date.now())-e.start)+' hr</span>'})});
  log.sort(function(a,b){return b.at-a.at});
  if(log.length)h+='<section><div class="row spread"><h3>Today</h3><span class="muted small">'+hrs(x.avail)+' hrs in shop &middot; '+hrs(x.ro)+' on repair orders &middot; '+hrs(x.etot)+' E-time</span></div><ul class="log">'+log.map(function(l){return '<li>'+l.h+'</li>'}).join('')+'</ul></section>';
  return h;
}

/* owner */
function grade(v,g,m){return v==null?'':v>=g?'good':v>=m?'mid':'bad'}
function vOverview(){
  var P=ui.period,K=ui.sort,now=Date.now(),t0=S.dayStart,span=now-t0;
  var rows=S.techs.map(function(t){return {t:t,p:perf(t.id,P)}}).filter(function(r){return r.p.avail>0.02});
  rows.sort(function(a,b){return (b.p[K]==null?-1:b.p[K])-(a.p[K]==null?-1:a.p[K])});
  var max=Math.max.apply(null,rows.map(function(r){return r.p.sold}).concat([0.01])),top=rows[0],lead='';
  var KL={sold:'sold hours',eff:'efficiency',prod:'productivity'};
  if(top){lead='<b>'+esc(top.t.name)+'</b> is the top performer '+(P=='month'?'this month':'today')+' by '+KL[K]+': '+top.p.sold.toFixed(1)+' sold hours'+(top.p.eff!=null?' at '+top.p.eff+'% efficiency':'')+'.';
    var low=rows.slice().sort(function(a,b){return a.p.prod-b.p.prod})[0];
    if(low&&low!=top&&low.p.prod<80)lead+=' <b>'+esc(low.t.name)+'</b> needs a look: only '+low.p.prod+'% of shop time went to repair orders, with '+low.p.et.toFixed(1)+' hours of E-time.'}
  var seg=function(act,cur,opts){return '<div class="seg">'+opts.map(function(o){return '<button data-act="'+act+'" data-v="'+o[0]+'" aria-pressed="'+(cur==o[0])+'">'+o[1]+'</button>'}).join('')+'</div>'};
  var n={ro:0,e:0,idle:0,all:0}; S.techs.forEach(function(t){var s=status(t.id);if(s in n){n[s]++;n.all++}});
  var pos=function(a,b){return 'left:'+((a-t0)/span*100).toFixed(2)+'%;width:'+(((b||now)-a)/span*100).toFixed(2)+'%'};
  return '<section><div class="row spread"><h2>Top performers</h2><div class="row">'+seg('period',P,[['today','Today'],['month','This month']])+seg('sort',K,[['sold','Sold hours'],['eff','Efficiency'],['prod','Productivity']])+'</div></div>'+
  '<p class="lead">'+lead+'</p>'+
  '<div class="scroll"><table class="rank"><thead><tr><th></th><th class="l">Technician</th><th class="l">Sold hours</th><th></th><th>Efficiency</th><th>Productivity</th><th>E-time</th></tr></thead><tbody>'+
  rows.map(function(r,i){var p=r.p;return '<tr class="'+(i==0?'first':'')+'"><td class="n">'+(i+1)+'</td><td class="l name">'+esc(r.t.name)+(i==0?'<span class="tag">Top performer</span>':'')+'</td>'+
    '<td class="barcell"><div class="bar"><i style="width:'+(p.sold/max*100).toFixed(1)+'%"></i></div></td><td><b>'+p.sold.toFixed(1)+'</b></td>'+
    '<td class="'+grade(p.eff,100,85)+'">'+(p.eff==null?'<span class="muted">n/a</span>':p.eff+'%')+'</td><td class="'+grade(p.prod,90,80)+'">'+p.prod+'%</td><td>'+p.et.toFixed(1)+' hr</td></tr>'}).join('')+
  '</tbody></table></div>'+
  '<p class="muted small" style="max-width:44em"><b>Sold hours</b> are the billed hours on finished repair orders. <b>Efficiency</b> is sold hours divided by hours clocked on repair orders, so above 100% means beating the book. <b>Productivity</b> is the share of shop time spent on repair orders instead of E-time.'+(P=='month'?' Month figures are the June totals from the CompuTrek sheet plus today’s example punches.':'')+'</p></section>'+
  shop(rows,P)+
  '<section><div class="row spread"><h2>Right now</h2><span class="muted small">'+n.all+' of '+S.techs.length+' clocked in &middot; '+n.ro+' on repair orders &middot; '+n.e+' on E-time &middot; '+n.idle+' idle</span></div><div>'+
  S.techs.map(function(t){var s=status(t.id),a=activity(t.id);
    return '<div class="live"><b>'+esc(t.name)+'</b>'+st(s)+'<div class="track">'+
      S.punches.filter(function(p){return p.tech==t.id}).map(function(p){return '<i class="shift" style="'+pos(p.in,p.out)+'"></i>'}).join('')+
      S.entries.filter(function(e){return e.tech==t.id}).map(function(e){return '<i class="'+e.kind+'" style="'+pos(e.start,e.end)+'" title="'+esc(label(e))+'"></i>'}).join('')+
      '</div><span style="text-align:right">'+(a?'<span data-since="'+a.since+'"></span>':'')+'</span></div>'}).join('')+
  '</div><div class="row small muted" style="gap:18px"><span><i class="dot ro"></i> Repair order</span><span><i class="dot e"></i> E-time</span><span><i class="dot idle"></i> Idle</span><span>Bars run from '+tm(t0)+' to now</span></div></section>';
}
function shop(rows,P){
  var t={sold:0,avail:0,ro:0}; rows.forEach(function(r){t.sold+=r.p.sold;t.avail+=r.p.avail;t.ro+=r.p.ro});
  var eff=t.ro>0.02?pct(t.sold,t.ro):null,prod=pct(t.ro,t.avail),e=reportRows().pop().x.e;
  var codes=ECODES.map(function(c){return {c:c,ms:e[c[0]]||0}}).filter(function(x){return x.ms>30000}).sort(function(a,b){return b.ms-a.ms}),max=codes.length?codes[0].ms:1;
  var fig=function(v,l,cls){return '<div class="fig"><b class="'+(cls||'')+'">'+v+'</b><span>'+l+'</span></div>'};
  return '<section><h2>The shop '+(P=='month'?'this month':'today')+'</h2><div class="figs">'+
    fig(t.sold.toFixed(1),'sold hours')+fig(eff==null?'n/a':eff+'%','efficiency',grade(eff,100,85))+fig(prod==null?'n/a':prod+'%','productivity',grade(prod,90,80))+fig((t.avail-t.ro).toFixed(1),'hours of E-time')+'</div>'+
    (codes.length?'<h3 style="margin-top:8px">Where today\u2019s E-time went</h3><div>'+codes.map(function(x){
      return '<div class="erow"><span><b>'+x.c[0]+'</b> '+x.c[1]+'</span><div class="bar"><i style="width:'+(x.ms/max*100).toFixed(1)+'%"></i></div><span>'+hrs(x.ms)+' hr</span></div>'}).join('')+'</div>':'')+'</section>';
}
function reportRows(){
  var tot={e:{},etot:0,sold:0,avail:0,ro:0};
  var rows=S.techs.map(function(t){var x=stats(t.id);
    ECODES.forEach(function(c){tot.e[c[0]]=(tot.e[c[0]]||0)+(x.e[c[0]]||0)}); tot.etot+=x.etot;tot.sold+=x.sold;tot.avail+=x.avail;tot.ro+=x.ro;
    return {name:t.id+' '+t.name,x:x}});
  rows.push({name:'Daily totals',x:tot,total:true}); return rows;
}
function vReport(){
  var rows=reportRows(),nIn=S.techs.filter(function(t){return stats(t.id).avail>0}).length;
  var tr=function(r){var x=r.x,p=pct(x.ro,x.avail),ef=x.ro>0?pct(x.sold*H,x.ro):null,d=x.avail>0?pct(x.ro,FORECAST*H*(r.total?nIn:1)):null;
    return '<tr><td>'+esc(r.name)+'</td>'+ECODES.map(function(c){return '<td>'+blank(x.e[c[0]]||0)+'</td>'}).join('')+
      '<td><b>'+blank(x.etot)+'</b></td><td>'+(x.sold?x.sold.toFixed(2):'')+'</td><td>'+blank(x.avail)+'</td><td>'+blank(x.ro)+'</td>'+
      '<td class="'+grade(p,90,80)+'">'+(p==null?'':p+'%')+'</td><td class="'+grade(ef,100,85)+'">'+(ef==null?'':ef+'%')+'</td><td>'+(d==null?'':d+'%')+'</td></tr>'};
  return '<section><div class="row spread"><div><h2>Daily time control summary</h2><span class="muted small">'+new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',year:'numeric'})+' &middot; forecast '+FORECAST.toFixed(2)+' hours per tech</span></div><button class="btn" data-act="copy">Copy for spreadsheet</button></div>'+
  (ui.copy?'<div class="stack"><p class="small">Select all of this text, copy it, and paste it into Excel or Google Sheets.</p><textarea id="tsv" readonly>'+esc(ui.copy)+'</textarea></div>':'')+
  '<div class="scroll"><table><thead><tr><th>Technician</th>'+ECODES.map(function(c){return '<th>'+c[0]+'<small>'+c[1]+'</small></th>'}).join('')+
  '<th>A<small>Total E-time</small></th><th>B<small>Sold hours paid</small></th><th>C<small>Available hours</small></th><th>D<small>Time producing</small></th><th>D/C<small>Productivity</small></th><th>B/D<small>Efficiency</small></th><th>D/E<small>Door-open productivity</small></th></tr></thead>'+
  '<tbody>'+rows.slice(0,-1).map(tr).join('')+'</tbody><tfoot>'+tr(rows[rows.length-1])+'</tfoot></table></div>'+
  '<p class="muted small" style="max-width:44em">These are the same columns as the paper CompuTrek sheet, filled in from the punches. Sold hours count once a job is marked complete, so efficiency reads low until open jobs are finished.</p></section>';
}
function reportTSV(){
  var head=['Technician'].concat(ECODES.map(function(c){return c[0]+' '+c[1]}),['Total E','Sold hours paid','Available hours','Time producing','Productivity %','Efficiency %']);
  return [head.join('\t')].concat(reportRows().map(function(r){var x=r.x,p=pct(x.ro,x.avail),ef=x.ro>0?pct(x.sold*H,x.ro):null;
    return [r.name].concat(ECODES.map(function(c){return hrs(x.e[c[0]]||0)}),[hrs(x.etot),x.sold.toFixed(2),hrs(x.avail),hrs(x.ro),p==null?'':p,ef==null?'':ef]).join('\t')})).join('\n');
}
function vROs(){
  var missing=S.jobs.filter(function(j){return j.status=='done'&&j.sold==null}).length;
  return '<section><div><h2>Repair orders</h2><p class="muted small" style="max-width:44em;margin-top:6px">Technicians type in the RO number from the printed repair order when they start a job. Add or correct the sold hours here.'+(missing?' <b class="mid">'+missing+' finished job'+(missing>1?'s are':' is')+' missing sold hours.</b>':'')+'</p></div>'+
  '<div class="scroll"><table><thead><tr><th>RO</th><th class="l">Note from tech</th><th class="l">Worked by</th><th>Status</th><th>Clocked</th><th>Sold hours</th><th>Over / under</th></tr></thead><tbody>'+
  S.jobs.slice().reverse().map(function(j){var cl=jobClocked(j.id),names=[],on=false;
    S.entries.forEach(function(e){if(e.kind=='ro'&&e.ref==j.id){var n=tech(e.tech).name;if(names.indexOf(n)<0)names.push(n);if(!e.end)on=true}});
    var v=j.sold==null?null:cl/H-j.sold;
    return '<tr><td><b>'+esc(j.id)+'</b></td><td class="l wrapc">'+(esc(j.desc)||'<span class="muted">None</span>')+'</td><td class="l">'+esc(names.join(', '))+'</td>'+
      '<td>'+(j.status=='done'?'<span class="st"><i></i>Finished</span>':on?'<span class="st ro"><i></i>In progress</span>':'<span class="st e"><i></i>Paused</span>')+'</td><td>'+hrs(cl)+'</td>'+
      '<td><input type="text" inputmode="decimal" id="sold-'+esc(j.id)+'" data-sold="'+esc(j.id)+'" value="'+(j.sold==null?'':j.sold)+'" placeholder="Add" aria-label="Sold hours for RO '+esc(j.id)+'"></td>'+
      '<td class="'+(v!=null&&j.status=='done'?(v>0?'bad':'good'):'')+'">'+(v==null?'':(v>0?'+':'')+v.toFixed(2))+'</td></tr>'}).join('')+'</tbody></table></div></section>';
}
function vOwner(){
  var T=[['overview','Overview'],['report','Daily report'],['ros','Repair orders']],V={overview:vOverview,report:vReport,ros:vROs};
  return '<nav class="tabs" role="tablist">'+T.map(function(t){return '<button role="tab" aria-selected="'+(ui.tab==t[0])+'" data-act="tab" data-v="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</nav>'+V[ui.tab]();
}

function render(){
  var w='';
  if(ui.user){
    if(ui.user=='owner')w+='<label class="row small muted" style="gap:8px">View as<select id="viewas"><option value="">Owner (me)</option>'+S.techs.map(function(t){return '<option value="'+t.id+'"'+(ui.viewAs==t.id?' selected':'')+'>'+esc(t.name)+'</option>'}).join('')+'</select></label>';
    w+='<span class="small">'+(ui.user=='owner'?'Brian, owner':esc(tech(ui.user).name))+'</span><button class="link" data-act="signout">Sign out</button>';
  } else w='<span class="small muted" id="clk"></span>';
  document.getElementById('who').innerHTML=w;
  document.getElementById('view').innerHTML=!ui.user?vLogin():(ui.user=='owner'&&!ui.viewAs)?vOwner():vTech(me());
  var f=document.getElementById('tsv')||document.getElementById('pin')||document.getElementById('sold'); if(f){f.focus();if(f.select)f.select()}
  tick();
}
function tick(){
  var now=new Date(),c=document.getElementById('clk');
  if(c)c.textContent=now.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})+', '+now.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  var els=document.querySelectorAll('[data-since]'); for(var i=0;i<els.length;i++)els[i].textContent=hms(now-els[i].dataset.since);
}
S=load(); render();
setInterval(tick,1000);
setInterval(function(){ var a=document.activeElement; if(ui.user=='owner'&&!ui.viewAs&&ui.tab=='overview'&&!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))render() },30000);
})();
</script>
